apiVersion: v1
kind: Service
metadata:
  name: angular-frontend-service
spec:
  type: NodePort # This is the type that exposes a port on the k3s node (your WSL2)
  selector:
    app: angular-frontend # Must match the label in your Deployment template
  ports:
    - protocol: TCP
      port: 80 # Port the service itself listens on (internal cluster port)
      targetPort: 80 # Port on the container to forward traffic to (Nginx)
      nodePort: 30080 # Optional: You can specify a port (must be between 30000-32767)
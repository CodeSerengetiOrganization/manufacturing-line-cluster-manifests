apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: machine-monitoring

# Strimzi Kafka Operator Configuration (KRaft Mode)
# This kustomization file references the Kafka CRD and KafkaNodePool
# The Strimzi operator must be installed first (see deploy.sh)
#
# Note: Strimzi uses Kubernetes Custom Resources instead of Helm charts
# In KRaft mode, we need both Kafka and KafkaNodePool resources
resources:
  - kafka.yaml
  - kafka-node-pool.yaml
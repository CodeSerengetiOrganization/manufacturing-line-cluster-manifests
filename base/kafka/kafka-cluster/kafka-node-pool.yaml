apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-broker
  namespace: machine-monitoring
  labels:
    app: kafka
    # Link this node pool to the Kafka cluster named "kafka"
    strimzi.io/cluster: kafka
spec:
  replicas: 1  # Single node for development
  roles:
    - broker
    - controller  # Combined broker+controller for single-node KRaft setup
  
  # Storage configuration
  storage:
    type: persistent-claim  # Critical for manufacturing compliance
    size: 20Gi              # Adjust based on production volume
    class: local-path       # K3s default, perfect for single-node
    deleteClaim: false      # Never auto-delete production data
  
  # Resource limits
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1024Mi
      cpu: 500m
